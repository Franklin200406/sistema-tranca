<header class="dashboard-header">
  <div class="brand-block">
    <span class="brand-icon material-symbols-outlined">shield_lock</span>
    <div>
      <p class="eyebrow">Dashboard</p>
      <h2>Central da Tranca</h2>
    </div>
  </div>

  <div class="header-actions">
    <div class="session-card">
      <span class="session-user">{{ usuarioLogin }}</span>
      <span class="session-nivel" [class.is-admin]="usuarioNivel === 'proprietario'">{{ usuarioNivel }}</span>
    </div>

    <button class="btn-logout" type="button" (click)="logout.emit()">
      <span class="material-symbols-outlined">logout</span>
    </button>
  </div>
</header>
